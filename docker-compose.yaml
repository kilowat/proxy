version: "3.8"

services:
  mtproto:
    image: telegrammessenger/proxy
    container_name: mtproto
    restart: always
    ports:
      - "443:443"
    env_file:
      - .env

  xray:
    image: teddysun/xray
    container_name: xray
    restart: always
    ports:
      - "8443:443"
    env_file:
      - .env
    volumes:
      - ./xray-config.json.template:/etc/xray/config.json
    command: xray run -config /etc/xray/config.json
